<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#131314" media="(prefers-color-scheme: dark)" />
        <meta name="theme-color" content="#f8fafd" media="(prefers-color-scheme: light)" />
        <title>Postman API</title>
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <style>
            :root {
                color-scheme: dark;
                --surface: #1e1f20;
                --surface-muted: #131314;
                --border: #444746;
                --ink: #e3e3e3;
                --ink-strong: #e8eaed;
                --muted: #9aa0a6;
                --accent: #a5b4fc;
                --accent-tint: #312e81;
                --on-accent: #1e1b4b;
                --success: #6dd58c;
                --success-container: #1e3b28;
                --danger: #f2b8b5;
                --danger-container: #3b1f1c;
            }

            @media (prefers-color-scheme: light) {
                :root {
                    color-scheme: light;
                    --surface: #fff;
                    --surface-muted: #f8fafd;
                    --border: #dadce0;
                    --ink: #202124;
                    --ink-strong: #3c4043;
                    --muted: #5f6368;
                    --accent: #4f46e5;
                    --accent-tint: #eef2ff;
                    --on-accent: #fff;
                    --success: #137333;
                    --success-container: #e6f4ea;
                    --danger: #b3261e;
                    --danger-container: #fce8e6;
                }
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                min-height: 100%;
                margin: 0;
            }

            body {
                display: grid;
                min-width: 320px;
                min-height: 100dvh;
                padding: 24px;
                place-items: center;
                background: var(--surface-muted);
                color: var(--ink);
                font-family: Roboto, Arial, sans-serif;
                -webkit-font-smoothing: antialiased;
            }

            main {
                width: 100%;
                max-width: 440px;
                text-align: center;
            }

            .brand {
                margin-bottom: 28px;
                color: var(--ink-strong);
                font-size: 25px;
                font-weight: 500;
                letter-spacing: -0.35px;
            }

            .card {
                margin-bottom: 24px;
                padding: 20px;
                border: 1px solid var(--border);
                border-radius: 16px;
                background: var(--surface);
                text-align: left;
            }

            .status {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 18px;
                font-size: 15px;
                font-weight: 500;
            }

            .status-dot {
                width: 10px;
                height: 10px;
                flex: 0 0 auto;
                border-radius: 50%;
                background: var(--muted);
            }

            .status[data-state="ok"] {
                color: var(--success);
            }

            .status[data-state="ok"] .status-dot {
                background: var(--success);
                box-shadow: 0 0 0 4px var(--success-container);
                animation: pulse 2s ease-in-out infinite;
            }

            .status[data-state="down"] {
                color: var(--danger);
            }

            .status[data-state="down"] .status-dot {
                background: var(--danger);
                box-shadow: 0 0 0 4px var(--danger-container);
            }

            @keyframes pulse {
                50% {
                    opacity: 0.55;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .status-dot {
                    animation: none !important;
                }
            }

            dl {
                display: grid;
                grid-template-columns: auto minmax(0, 1fr);
                gap: 10px 16px;
                margin: 0;
                font-size: 13px;
            }

            dt {
                color: var(--muted);
            }

            dd {
                margin: 0;
                overflow: hidden;
                color: var(--ink-strong);
                font-family: "Roboto Mono", ui-monospace, "SF Mono", Menlo, monospace;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .actions {
                display: grid;
                gap: 10px;
            }

            a {
                display: grid;
                min-height: 44px;
                padding: 0 22px;
                place-items: center;
                border: 1px solid transparent;
                border-radius: 22px;
                font-size: 14px;
                font-weight: 500;
                letter-spacing: 0.1px;
                text-decoration: none;
            }

            .primary {
                background: var(--accent);
                color: var(--on-accent);
            }

            .primary:hover {
                filter: brightness(1.08);
            }

            .secondary {
                border-color: var(--border);
                color: var(--accent);
            }

            .secondary:hover {
                background: var(--accent-tint);
            }

            a:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 2px;
            }

            footer {
                margin-top: 24px;
                color: var(--muted);
                font-size: 12px;
            }
        </style>
    </head>
    <body>
        <main>
            <div class="brand">Postman</div>

            <div class="card">
                <div class="status" id="status" data-state="checking">
                    <span class="status-dot"></span>
                    <span id="status-text">Checking the server</span>
                </div>
                <dl>
                    <dt>API</dt>
                    <dd>/api/v1</dd>
                    <dt>Database</dt>
                    <dd id="database">Checking</dd>
                    <dt>Auth</dt>
                    <dd>Required</dd>
                </dl>
            </div>

            <div class="actions">
                <a class="primary" id="app-link" href="http://localhost:3000">Open the app</a>
                <a class="secondary" href="/api/v1/health">View the health endpoint</a>
            </div>

            <footer>Postman - compose, send, and analyze HTTP requests</footer>
        </main>

        <script>
            document.getElementById("app-link").href = `${location.protocol}//${location.hostname}:3000`;

            const status = document.getElementById("status");
            const statusText = document.getElementById("status-text");
            const database = document.getElementById("database");

            function render(state, message, databaseLabel) {
                status.dataset.state = state;
                statusText.textContent = message;
                database.textContent = databaseLabel;
            }

            fetch("/api/v1/health")
                .then((response) => response.json())
                .then((payload) => {
                    const connected = payload?.data?.database === "connected";
                    render(
                        connected ? "ok" : "down",
                        connected ? "Server running" : "Server degraded",
                        connected ? "Connected" : "Not connected",
                    );
                })
                .catch(() => render("down", "Server unreachable", "Unknown"));
        </script>
    </body>
</html>
